name: release

# Tag-triggered broker publication (TIN-4655; SWB-R55, R-C304, R-N13, R-C228).
#
# Runs only for a signed annotated tag vMAJOR.MINOR.PATCH[-pre] pushed to
# xoxd-ai/agent-switchboard. It never runs on pull_request or merge_group and
# depends on no merge_group result. The order is fail-closed:
#
#   1. `release-check --tag --tag-signer --main-ref origin/main` proves the tag
#      is signed by the pinned operator release key, points at the checked-out
#      commit, sits on main, and that all protected build/runtime inputs equal
#      the approved signed source in docs/releases/approved-broker.json. The
#      key ring also holds GitHub's merge key, because the SWB-R55 source is a
#      GitHub merge commit (R-C304); it never satisfies the tag pin.
#   1a. The approved `source` is read once from approved-broker.json, checked
#      to be a 40-hex ancestor of HEAD, and used as --embed_label for both the
#      build and the push (TIN-4655 comment 3126a35f): the tag may sit on a
#      later commit, and labelling that commit would change the digest.
#   2. Bazel builds //deploy:image.digest with the pinned Nix C toolchain
#      registered in MODULE.bazel (//tools/cc, zig cc from the nixpkgs in
#      tools/cc/nixpkgs.nix; R-C416, amending R-C282), so the runner needs
#      `nix-build` but no host C compiler, and the approved source as
#      --embed_label (R-C268), and `release-check --built-digest`
#      refuses unless it equals the approved immutable digest. A different
#      image is a new publication that needs its own ruling, so nothing is
#      pushed.
#   3. `bazelisk run //deploy:push` uploads by digest only (no mutable tag).
#      Both Bazel steps use the release devShell's flake.lock-pinned bazelisk
#      and refuse one that does not resolve into /nix/store; no runner-supplied
#      Bazelisk fact is consulted (operator direction 2026-10-05).
#   4. The manifest is read back from ghcr.io by digest and checked with
#      `release-check --registry-manifest` (digest and byte size).
#   5. The report and raw manifest bytes are kept as a workflow artifact.
#
# The workflow writes evidence and grants no approval: release-check always
# reports publication_authorized=false and live_acceptance=false.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Primary fingerprints of docs/releases/release-signers.asc. The imported
  # key ring must contain exactly these two primary keys: the operator release
  # key, which alone may sign release tags, and GitHub's merge key
  # (B5690EEEBB952194), which signed the SWB-R55 source commit (R-C304).
  RELEASE_SIGNER_FPR: 161895136D2E5C292D2A663D0B01977B8DD5DA60
  GITHUB_MERGE_FPR: 968479A1AFF927E37D1A566BB5690EEEBB952194
  IMAGE_REPOSITORY: ghcr.io/xoxd-ai/agent-switchboard
  BAZEL_PLATFORM: //platforms:x86_64-unknown-linux-gnu

jobs:
  publish:
    name: publish approved broker image
    if: github.repository == 'xoxd-ai/agent-switchboard' && github.ref_type == 'tag'
    # Same single ARC scale-set label as ci.yml; extra labels never match a
    # GloriousFlywheel scale set.
    runs-on: tinyland-nix
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: nix develop .#release --max-jobs 1 --cores 2 --command bash -euo pipefail {0}
    steps:
      - name: Check out the tagged revision with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore the annotated tag object
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # actions/checkout may leave a lightweight ref for the triggering tag.
          # The repository is private and checkout did not persist credentials,
          # so authenticate this one fetch through the environment (never argv).
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git fetch --no-tags --force origin "refs/tags/${TAG}:refs/tags/${TAG}" "refs/heads/main:refs/remotes/origin/main"

      - name: Import the pinned release signer
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          gpg --batch --import docs/releases/release-signers.asc
          primaries="$(gpg --batch --with-colons --fingerprint | awk -F: '$1=="pub"{p=1;next} p&&$1=="fpr"{print $10;p=0}')"
          expected="$(printf '%s\n' "$RELEASE_SIGNER_FPR" "$GITHUB_MERGE_FPR" | sort)"
          if [[ "$(sort <<<"$primaries")" != "$expected" ]]; then
            echo "::error::release signer key ring is not exactly ${RELEASE_SIGNER_FPR} and ${GITHUB_MERGE_FPR}"
            exit 1
          fi
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Gate on signed tag, main ancestry and approved source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release-check.py --tag "$TAG" --tag-signer "$RELEASE_SIGNER_FPR" --main-ref origin/main

      - name: Read the approved source once
        id: approved
        run: |
          # TIN-4655 comment 3126a35f: the revision label, and so the digest,
          # is the approved source, never the tag or HEAD. Read it once here,
          # after the gate, and pass this one value to both build and push.
          approved="$(jq -er .source docs/releases/approved-broker.json)"
          if [[ ! "$approved" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::approved-broker.json source is not a 40-hex sha"
            exit 1
          fi
          git merge-base --is-ancestor "$approved" HEAD
          echo "source=$approved" >> "$GITHUB_OUTPUT"

      - name: Build the image digest and refuse anything unapproved
        env:
          TAG: ${{ github.ref_name }}
          APPROVED_SOURCE: ${{ steps.approved.outputs.source }}
        run: |
          # Bazelisk is the release devShell's flake.lock-pinned package, not a
          # runner-supplied binary (operator direction 2026-10-05). Refuse
          # anything on PATH that does not resolve into /nix/store.
          BAZELISK="$(command -v bazelisk)" || { echo "::error::bazelisk is not on the release devShell PATH"; exit 1; }
          if [[ "$(readlink -f "$BAZELISK")" != /nix/store/* ]]; then
            echo "::error::bazelisk resolves to $(readlink -f "$BAZELISK"), outside /nix/store"
            exit 1
          fi
          # R-C416 (amends R-C282): the C toolchain is the pinned Nix zig cc
          # that MODULE.bazel registers from //tools/cc, ahead of rules_cc's
          # host autodetection. Bazel fetches it with nix-build, so require
          # that, and never consult a host or devShell compiler: CC/CXX would
          # only matter to rules_cc's fallback, so refuse them rather than
          # leave a second toolchain path open. //deploy:swb_checked still
          # refuses a binary with a /nix/store, /execroot/ or /sandbox/ path
          # (R-C268).
          command -v nix-build >/dev/null || { echo "::error::nix-build is not on PATH; Bazel needs it to fetch the pinned C toolchain"; exit 1; }
          for var in CC CXX; do
            if [[ -n "${!var:-}" ]]; then
              echo "::error::${var} is set (${!var}); the release build uses only the pinned //tools/cc toolchain"
              exit 1
            fi
          done
          # R-C268: the image's org.opencontainers.image.revision label is the
          # approved source, exactly as the approved double-build stamped it.
          "$BAZELISK" --ignore_all_rc_files build --lockfile_mode=error \
            --platforms="$BAZEL_PLATFORM" --remote_executor= --remote_cache= \
            --embed_label="$APPROVED_SOURCE" \
            //deploy:image //deploy:image.digest
          python3 scripts/release-check.py --tag "$TAG" --tag-signer "$RELEASE_SIGNER_FPR" --main-ref origin/main \
            --built-digest bazel-bin/deploy/image.json.sha256

      - name: Push the approved image by digest
        env:
          APPROVED_SOURCE: ${{ steps.approved.outputs.source }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BAZELISK="$(command -v bazelisk)" || { echo "::error::bazelisk is not on the release devShell PATH"; exit 1; }
          if [[ "$(readlink -f "$BAZELISK")" != /nix/store/* ]]; then
            echo "::error::bazelisk resolves to $(readlink -f "$BAZELISK"), outside /nix/store"
            exit 1
          fi
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          install -d -m 0700 "$DOCKER_CONFIG"
          trap 'rm -f "$DOCKER_CONFIG/config.json"' EXIT
          ( umask 077
            auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
            jq -n --arg auth "$auth" '{auths: {"ghcr.io": {auth: $auth}}}' > "$DOCKER_CONFIG/config.json" )
          "$BAZELISK" --ignore_all_rc_files run --lockfile_mode=error \
            --platforms="$BAZEL_PLATFORM" --remote_executor= --remote_cache= \
            --embed_label="$APPROVED_SOURCE" \
            //deploy:push

      - name: Read the manifest back from the registry and verify it
        env:
          TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          digest="$(tr -d '[:space:]' < bazel-bin/deploy/image.json.sha256)"
          repo_path="${IMAGE_REPOSITORY#ghcr.io/}"
          # Credentials reach curl on stdin (-K -), never in argv.
          token="$(printf 'user = "x-access-token:%s"\n' "$GITHUB_TOKEN" \
            | curl --proto '=https' --fail --silent --show-error -K - \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo_path}:pull" | jq -r .token)"
          echo "::add-mask::${token}"
          evidence="$RUNNER_TEMP/release-evidence"
          install -d "$evidence"
          printf 'header = "Authorization: Bearer %s"\n' "$token" \
            | curl --proto '=https' --fail --silent --show-error -K - \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/${repo_path}/manifests/${digest}" \
            --output "$evidence/registry-manifest.json"
          python3 scripts/release-check.py --tag "$TAG" --tag-signer "$RELEASE_SIGNER_FPR" --main-ref origin/main \
            --built-digest bazel-bin/deploy/image.json.sha256 \
            --registry-manifest "$evidence/registry-manifest.json" \
            | tee "$evidence/release-check.json"
          cp bazel-bin/deploy/image.json.sha256 "$evidence/image.json.sha256"

      - name: Keep the release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
          retention-days: 90
